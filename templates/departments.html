<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Department Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
    <div class="card mt-5 ms-5 me-5">
        <div class="card-header d-flex">
            <h2 class="me-auto">Department of {{department.name}}</h2>
        </div>
        <div class="card-body">
            <h4>Overview</h4>
            <div class="mb-4">{{department.description}}</div>
            <table class="table table-striped">
                <thead>
                    <tr class="table-info">
                        <td colspan="5"><b>Doctors</b></td>
                    </tr>
                </thead>
                <tbody>
                    {% for doctor in department.doctors %}
                    <tr>
                        <td class="col-4">{{ doctor.full_name }}</td>
                        <td><a href="/check_availability?doc_id={{doctor.id}}" type="button"
                                class="btn btn-outline-primary btn-sm me-2">Check Availability</a>
                            <a href="/view/doctor?doctor_id={{doctor.id}}" type="button"
                                class="btn btn-outline-primary btn-sm me-2">View Details</a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
            <div class = "text-end">
                <a href="{{ back_url }}" class="btn btn-sm btn-secondary">Go Back</a>
            </div>
        </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

</html>
