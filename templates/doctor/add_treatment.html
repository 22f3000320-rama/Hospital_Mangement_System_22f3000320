<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treatment Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
    <div class="container min-vh-100 d-flex justify-content-center align-items-center bg-light">
        <div class="card shadow p-4" style="width: 400px;">
            <h3 class="mb-4">Update Treatment Details</h3>
            <p class="mb-1">Patient Name: {{ appointment.patient.full_name }}</p>
            <p class="mb-1">Doctor's Name: {{ appointment.doctor.full_name }}</p>
            <p>Department: {{ appointment.doctor.department.name }}</p>
            <form action="/add_treatment/patient?appointment_id={{appointment.id}}" method="POST">
                <div class="mb-3">
                    <label for="tests_done" class="form-label">Tests Done:</label>
                    <input type="text" class="form-control" id="tests_done" name="tests_done"
                        value="{% if treatment %}{{treatment.tests_done}}{% endif %}" required>
                </div>
                <div class="mb-3">
                    <label for="diagnosis" class="form-label">Diagnosis:</label>
                    <input type="text" class="form-control" id="diagnosis" name="diagnosis"
                        value="{% if treatment %}{{treatment.diagnosis}}{% endif %}" required>
                </div>
                <div class="mb-3">
                    <label for="prescription" class="form-label">Prescription:</label>
                    <input type="text" class="form-control" id="prescription" name="prescription"
                        value="{% if treatment %}{{treatment.prescription}}{% endif %}" required>
                </div>
                <div class="mb-4">
                    <label for="notes" class="form-label">Notes:</label>
                    <input type="text" class="form-control" id="notes" name="notes"
                        value="{% if treatment %}{{treatment.notes}}{% endif %}" required>
                </div>
                <div class="d-flex justify-content-between">
                    <a href="/dashboard/doc" class="btn btn-secondary" type="button">Back</a>
                    <button type="submit" class="btn btn-success">Save</button>
                </div>
            </form>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

</html>
