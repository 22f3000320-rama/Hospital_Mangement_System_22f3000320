<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Set Availability</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container min-vh-100 d-flex justify-content-center align-items-center bg-light">
        <div class="card shadow p-4" style="width: 400px;">
            <h3 class="fw-bold mb-4">Set Availability</h3>
            <form method="POST" action="/set_availability" class="p-3 bg-white rounded shadow-sm">


                <input type="hidden" name="date" value="{{ selected_date }}">


                <div class="mb-3">
                    <label class="form-label fw-bold">Date</label>
                    <input type="text" class="form-control" value="{{ selected_date.strftime('%a, %d %b %Y') }}"
                        disabled>
                </div>


                <label class="form-label fw-bold">Select your preferred slots:</label>
                <div class="btn-group mb-3" role="group">
                    {% for slot in slots %}
                    <input type="checkbox" class="btn-check" id="{{loop.index}}" name="slot_time" value="{{slot}}"
                        autocomplete="off" {% if inactive_slots[loop.index] %}disabled{% endif %}>
                    <label
                        class="btn {% if inactive_slots[loop.index] %} btn-outline-danger btn-sm me-2 {% else %} btn-outline-success btn-sm me-2 {% endif %}"
                        for="{{loop.index}}">{{ slot }}</label>
                    {% endfor %}
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold">Slot Duration</label>
                    <select name="slot_duration" class="form-select" required>
                        <option value="30">30 minutes</option>
                        <option value="40">40 minutes</option>
                    </select>
                </div>

                <div class="d-flex justify-content-between">
                    <a href="/doc_availability" class="btn btn-secondary">Go Back</a>
                    <button type="submit" class="btn btn-success fw-bold">
                        Save Availability
                    </button>
                </div>
            </form>
        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
