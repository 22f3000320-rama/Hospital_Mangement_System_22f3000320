<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .object-fit-cover {
      object-fit: cover;
      object-position: center;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="container-fluid p-5 bg-secondary text-white text-center">
    <h1>Welcome to First_Priority</h1>
    <p>One stop solution to all your healthcare problems</p>
  </div>

  <!-- Hero Section -->
  <div class="container-fluid min-vh-100 d-flex align-items-center bg-light">
    <div class="row w-100 flex-nowrap">
      <!-- Left Side: Text -->
      <div class="col-md-6 d-flex flex-column justify-content-center ps-md-5 text-center text-md-start">
        <h3 class="display-6 mb-4">
          We at <span class="text-secondary">First_Priority</span><br>
          specialize in providing everything<br>
          to keep you and your family healthy...
        </h3>

        <div>
          <a href="/register" class="btn btn-secondary me-2">Register</a>
          <a href="/login" class="btn btn-secondary">Login</a>
        </div>
      </div>

      <!-- Right Side: Image -->
      <div class="col-md-6 p-0">
        <img src="https://i.pinimg.com/564x/f9/1d/80/f91d803719f2a49a33ac78d8639e462a.jpg"
             class="img-fluid h-100 w-100 object-fit-cover"
             alt="Doctor image">
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
